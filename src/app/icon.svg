<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Circle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="url(#amberGold)" stroke-width="12" />

  <!-- PDR Reflection Light Grid Lines -->
  <path d="M90 160 h332 M90 220 h332 M90 280 h332 M90 340 h332" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-dasharray="10 10" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#amberGold)" stroke-width="8" opacity="0.3" filter="url(#glow)" />

  <!-- Central Shield / Car Dent Beam Symbol -->
  <path d="M256 90 L370 150 V270 C370 345 320 405 256 425 C192 405 142 345 142 270 V150 Z" fill="none" stroke="url(#amberGold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lightning / PDR Lamp Beam Icon inside Shield -->
  <path d="M275 140 L195 260 H260 L235 370 L315 250 H250 Z" fill="url(#amberGold)" filter="url(#glow)" />
</svg>
